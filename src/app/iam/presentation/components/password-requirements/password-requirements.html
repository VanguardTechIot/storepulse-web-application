<mat-chip-set role="group" [attr.aria-label]="'iam.password_requirements.label' | translate" aria-live="polite">
  @for (requirement of requirements(); track requirement.key) {
    <app-status-chip [tone]="tones[requirement.state]" [dot]="true">
      {{ 'iam.password_requirements.' + requirement.key | translate: { count: minimumLength } }}
      @if (requirement.state !== 'pending') {
        <span class="sr-only">({{ 'iam.password_requirements.' + requirement.state | translate }})</span>
      }
    </app-status-chip>
  }
</mat-chip-set>
