<header class="page-head">
  <div>
    <h1>{{ 'profiles.profile.page_title' | translate }}</h1>
    <p>{{ 'profiles.profile.subtitle' | translate }}</p>
  </div>
  <div class="actions">
    <button matButton="outlined" type="button" (click)="signOut()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      {{ 'profiles.profile.sign_out' | translate }}
    </button>
  </div>
</header>

@if (store.profile(); as profile) {
  @if (store.error(); as error) {
    <app-callout type="danger" icon="error" role="alert">{{ 'profiles.errors.' + error | translate }}</app-callout>
  }

  <div class="profile-grid">
    <app-profile-photo-card [profile]="profile" [role]="store.owner()?.role ?? null" />
    <div class="main">
      <app-profile-details-form [profile]="profile" />
      <app-subscription-summary-card />
    </div>
  </div>
} @else if (store.error(); as error) {
  <app-page-state status="error" [title]="'profiles.errors.' + error | translate" (retry)="store.load()" />
} @else {
  <app-page-state status="loading" />
}
