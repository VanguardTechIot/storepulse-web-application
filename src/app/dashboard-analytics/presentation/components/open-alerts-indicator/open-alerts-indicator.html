@if (count() > 0) {
  <a id="open-alerts-chip" class="chip" [routerLink]="alertsRoute">
    <span class="chip__dot" aria-hidden="true"></span>
    {{ 'toolbar.active_incident' | translate: { count: count() } }}
  </a>
}
<a
  id="alerts-bell"
  matIconButton
  [routerLink]="alertsRoute"
  [attr.aria-label]="'toolbar.notifications' | translate"
  [matBadge]="count()"
  [matBadgeHidden]="count() === 0"
>
  <mat-icon aria-hidden="true">notifications</mat-icon>
</a>
