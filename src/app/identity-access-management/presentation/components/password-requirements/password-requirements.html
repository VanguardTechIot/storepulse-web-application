<mat-list class="requirements" [attr.aria-label]="'iam.password-requirements.label' | translate" aria-live="polite">
  @for (requirement of requirements(); track requirement.key) {
    <mat-list-item [class]="requirement.state">
      <mat-icon matListItemIcon aria-hidden="true">{{ icon(requirement.state) }}</mat-icon>
      <span matListItemTitle>
        {{ 'iam.password-requirements.' + requirement.key | translate: { count: minimumLength } }}
        @if (requirement.state !== 'pending') {
          <span class="sr-only">({{ 'iam.password-requirements.' + requirement.state | translate }})</span>
        }
      </span>
    </mat-list-item>
  }
</mat-list>
