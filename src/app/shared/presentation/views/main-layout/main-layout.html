<mat-sidenav-container class="layout">
  <mat-sidenav #sidenav [mode]="compact() ? 'over' : 'side'" [opened]="!compact()">
    <app-sidebar-navigation (navigate)="compact() && sidenav.close()" />
  </mat-sidenav>

  <mat-sidenav-content>
    <app-toolbar (menu)="sidenav.toggle()" />

    <main class="layout__content" id="main-content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
