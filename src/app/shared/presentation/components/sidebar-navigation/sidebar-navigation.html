<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2-5 4 10 2-5h6" />
      </svg>
    </span>
    <span class="sidebar__name">Store<strong>Pulse</strong></span>
    <span class="sidebar__live" aria-hidden="true"></span>
  </div>

  <div class="sidebar__module-tag">{{ i18n.t('nav.gallery_management') }}</div>

  <div class="sidebar__section">{{ i18n.t('nav.main_modules') }}</div>

  <nav class="sidebar__nav" aria-label="Módulos">
    @for (item of items; track item.key) {
      <a class="sidebar__link" [routerLink]="item.route" routerLinkActive="is-active">
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="item.icon" />
        </svg>
        <span class="sidebar__label">{{ i18n.t(item.labelKey) }}</span>
        @if (item.dot) {
          <span class="sidebar__dot" aria-hidden="true"></span>
        }
      </a>
    }
  </nav>
</aside>
