<aside id="side-navigation" class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__logo" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 12h4l2-5 4 10 2-5h6" />
      </svg>
    </span>
    <span class="sidebar__name">Store<strong>Pulse</strong></span>
    <span class="sidebar__live" aria-hidden="true"></span>
  </div>

  <div class="sidebar__module-tag">{{ 'nav.gallery_management' | translate }}</div>

  <div class="sidebar__section">{{ 'nav.main_modules' | translate }}</div>

  <nav class="sidebar__nav" [attr.aria-label]="'nav.main_modules' | translate">
    @for (item of items; track item.key) {
      <a
        [id]="item.key + '-link'"
        class="sidebar__link"
        [routerLink]="item.route"
        routerLinkActive="is-active"
        (click)="navigate.emit()"
      >
        <svg
          class="sidebar__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [attr.d]="item.icon" />
        </svg>
        <span class="sidebar__label">{{ item.labelKey | translate }}</span>
      </a>
    }
  </nav>
</aside>
