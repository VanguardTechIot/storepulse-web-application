<mat-button-toggle-group
  hideSingleSelectionIndicator
  [value]="i18n.lang()"
  [attr.aria-label]="'common.language.label' | translate"
  (change)="select($event)"
>
  @for (language of languages; track language.code) {
    <mat-button-toggle
      [value]="language.code"
      [aria-label]="language.nameKey | translate"
      [attr.lang]="language.code"
    >
      {{ language.label }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
