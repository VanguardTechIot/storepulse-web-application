<mat-button-toggle-group
  hideSingleSelectionIndicator
  [value]="currentLanguage()"
  [attr.aria-label]="'shared.language.label' | translate"
  (change)="select($event)"
>
  @for (language of languages; track language) {
    <mat-button-toggle
      [value]="language"
      [aria-label]="'shared.language.names.' + language | translate"
      [attr.lang]="language"
    >
      {{ 'shared.language.codes.' + language | translate }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
