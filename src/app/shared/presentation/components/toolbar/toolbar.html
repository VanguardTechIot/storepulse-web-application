<header class="toolbar">
  <div class="toolbar__left">
    <button
      id="menu-button"
      matIconButton
      type="button"
      [attr.aria-label]="'toolbar.menu' | translate"
      (click)="menu.emit()"
    >
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
    <app-gallery-badge />
  </div>

  <div class="toolbar__right">
    <app-open-alerts-indicator />
    <app-language-switcher />
    <app-authentication-section />
  </div>
</header>
