<header class="toolbar">
  <div class="toolbar__left">
    <button type="button" class="icon-btn" aria-label="Menú">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <button type="button" class="gallery-select">
      <span class="gallery-select__icon" aria-hidden="true">▦</span>
      <span class="gallery-select__text">
        <strong>{{ gallery.name }}</strong>
        <small>{{ gallery.locales }} {{ i18n.t('toolbar.locales') }} · {{ gallery.district }}</small>
      </span>
    </button>

    <span class="badge badge--danger alert-chip">
      <span aria-hidden="true">●</span> {{ i18n.t('toolbar.active_incident') }}
    </span>
  </div>

  <div class="toolbar__right">
    <select class="month-select" aria-label="{{ i18n.t('toolbar.period') }}">
      <option>Oct 2026</option>
      <option>Sep 2026</option>
    </select>

    <app-language-switcher />

    <a class="icon-btn icon-btn--bell" [routerLink]="appNav.notifications" [attr.aria-label]="i18n.t('toolbar.notifications')">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" />
      </svg>
      @if (unreadNotifications > 0) {
        <span class="icon-btn__count">{{ unreadNotifications }}</span>
      }
    </a>

    <app-authentication-section />
  </div>
</header>
